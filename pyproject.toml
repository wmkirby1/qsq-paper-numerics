[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsq-paper-numerics"
version = "0.1.0"
description = "Reproducible numerics for Quantum Krylov Algorithm for Szego Quadrature"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "networkx",
    "numpy",
    "qiskit",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
